<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8" />
    <title>Canvas</title>
    <base href="/canvas/" />

    <!-- Google Fonts - Hind Vadodara -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Add references to client css stylesheets-->
    <link href="css/drawing.css" rel="stylesheet" />
    <link href="css/loading.css" rel="stylesheet" />

    <!-- Add references to js scripts -->
    <script src="js/canvasHelper.js" defer></script>
    <script src="js/fileDownload.js"></script>

</head>
<body>
    <div id="loading-screen">
        <div class="loading-bubble-container">
            <div class="loading-bubble bubble1"></div>
            <div class="loading-bubble bubble2"></div>
            <div class="loading-bubble bubble3"></div>
        </div>
        <div class="loading-title">Loading Flipbook...</div>
    </div>
    <div id="app"></div>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Wait for Blazor to boot and render something
            var checkAppLoaded = setInterval(function () {
                // If Blazor has replaced #app's content, remove loading
                if (document.getElementById('app') && document.getElementById('app').innerHTML.trim() !== "") {
                    document.getElementById('loading-screen')?.remove();
                    clearInterval(checkAppLoaded);
                }
            }, 100);
        });
    </script
</body >
</html >
